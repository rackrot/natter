[tools]
bun = "1.4.4"
biome = "2.5.15"
nats-server = "2.15.2"
"aqua:nats-io/natscli" = "0.5.1"

[tasks.setup]
description = "Install dependencies"
run = "bun install"

[tasks.nats]
description = "Run a local JetStream-enabled nats-server"
run = "nats-server -js -a 127.0.0.1 -sd .nats-data"

[tasks.bootstrap]
description = "Create or reconcile the NATTER_* JetStream streams (admin)"
run = "bun src/bootstrap.ts"

[tasks.fleet-delete]
description = "Delete the five streams of NATTER_FLEET and all they hold (admin)"
run = "bun src/bootstrap.ts delete"

[tasks.doctor]
description = "Check the config, transport, auth, JetStream, streams and consumer of this session"
run = "bun src/doctor.ts"

[tasks.monitor]
description = "Tail NATTER_FLEET, or every fleet when unset, with the nats CLI (development only; payloads are untrusted)"
shell = "bash -c"
run = '''
creds="${NATTER_CREDS_DIR:-${NATTER_UC_CREDS_DIR:-$HOME/.config/natter}}"
creds="${creds/#\~/$HOME}"
args=(--server "${NATTER_URL:-${NATTER_UC_URL:-nats://127.0.0.1:4222}}")
[ -s "$creds/natter.nk" ] && args+=(--nkey "$creds/natter.nk")
ca="${NATTER_CA_FILE:-$NATTER_UC_CA_FILE}"
[ -n "$ca" ] && args+=(--tlsca "$ca")
exec nats "${args[@]}" sub "natter.${NATTER_FLEET:+$NATTER_FLEET.}>"
'''

[tasks.lint]
description = "Biome check and type check"
run = ["biome check .", "bunx tsc --noEmit"]

[tasks.fmt]
description = "Format with Biome"
run = "biome format --write ."

[tasks.test]
description = "Run tests"
run = "bun test"

[tasks.validate]
description = "Validate the plugin and marketplace manifests"
run = "claude plugin validate . --strict"

[tasks.check]
description = "Lint, test, and validate"
depends = ["lint", "test", "validate"]
