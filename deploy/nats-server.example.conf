# For personal use: one shared nkey user with no per-subject permissions. Fill in the placeholders.
listen: 0.0.0.0:4222
server_name: natter

# Public key (starts with U) of the seed kept at <creds_dir>/natter.nk.
authorization {
  users = [
    { nkey: CHANGE_ME_PUBLIC_NKEY }
  ]
}

tls {
  cert_file: "CHANGE_ME/server-cert.pem"
  key_file: "CHANGE_ME/server-key.pem"
}

jetstream {
  store_dir: "CHANGE_ME/natter-nats-data"
}
